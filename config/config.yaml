# 多环境配置，通过命令行参数切换
env:
  dev:
    base_url: "http://127.0.0.1:5000"
    db_host: "localhost"
    db_port: 3306
    db_user: "root"
    db_password: "Root@123456"
    timeout: 10
    retry: 2
  prod:
    base_url: "https://api.example.com"
    db_host: "10.0.0.1"
    db_port: 3306
    db_user: "readonly"
    db_password: "xxx"
    timeout: 15
    retry: 3
