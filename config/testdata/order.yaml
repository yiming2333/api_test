# ✅ 解耦版：每条用例自带 setup/teardown
test_order_isolated:
  - case_id: ORDER_ISO_001
    title: "创建订单后查询"
    setup:                              # ← 自己创建
      method: post
      url: /api/orders
      json:
        product_id: "SKU_ISO_001"
        quantity: 1
    request:
      method: get
      url: "/api/orders/${setup.order_id}"
    expect:
      status_code: 200
      db_check:
        - table: orders
          where: "order_id = %s"
          params: [ "${setup.order_id}" ]
          field: status
          expected: "pending"
      json_path:
        - ["$.data.status", "pending"]
    teardown:                           # ← 自己清理
      method: delete
      url: "/api/orders/${setup.order_id}"

  - case_id: ORDER_ISO_002
    title: "取消订单并验证DB"
    setup:
      method: post
      url: /api/orders
      json:
        product_id: "SKU_ISO_002"
        quantity: 1
    request:
      method: put
      url: "/api/orders/${setup.order_id}/cancel"
    expect:
      status_code: 200
      db_check:
        - table: orders
          where: "order_id = %s"
          params: ["${setup.order_id}"]
          field: status
          expected: "cancelled"
    teardown:
      method: delete
      url: "/api/orders/${setup.order_id}"