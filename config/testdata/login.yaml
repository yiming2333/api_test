test_login:
  - case_id: LOGIN_001
    title: "正确账号密码登录成功"
    mark: smoke
    request:
      method: post
      url: /api/auth/login
      json:
        username: testuser
        password: Test@123
    expect:
      status_code: 200
      json_path:
        - ["$.code", 0]
        - ["$.data.token", "not_null"]

  - case_id: LOGIN_002
    title: "密码错误返回401"
    mark: regression
    request:
      method: post
      url: /api/auth/login
      json:
        username: testuser
        password: wrong_pwd
    expect:
      status_code: 401
      json_path:
        - ["$.message", "用户名或密码错误"]

  - case_id: LOGIN_003
    title: "缺少用户名参数返回400"
    mark: regression
    request:
      method: post
      url: /api/auth/login
      json:
        password: Test@123
    expect:
      status_code: 400