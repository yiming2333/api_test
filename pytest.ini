# ============================================================
# pytest 配置文件（pytest.ini）
# ============================================================
# 位置：项目根目录/pytest.ini
# 作用：集中管理 pytest 的运行参数，避免每次命令行手动输入
# 优先级：pytest.ini > pyproject.toml > setup.cfg > tox.ini
# 文档：https://docs.pytest.org/en/stable/reference/customize.html


[pytest]

# ------------------------------------------------------------
# 测试用例搜索路径
# ------------------------------------------------------------
# pytest 只在这个目录下递归查找测试文件
# 不设置的话默认从当前目录开始搜索（可能误扫到 venv、node_modules 等）
# 多个路径用空格分隔：testpaths = testcases integration_tests
testpaths = testcases


# ------------------------------------------------------------
# 测试文件匹配规则
# ------------------------------------------------------------
# 只有文件名匹配此模式的 .py 文件才会被当作测试模块
# 支持 glob 通配符，多个模式用空格分隔
# 默认值就是 test_*.py，这里显式声明是为了明确约定
# 示例匹配：test_login.py, test_order_api.py
# 示例不匹配：login_test.py, helper.py, conftest.py
python_files = test_*.py


# ------------------------------------------------------------
# 测试类匹配规则
# ------------------------------------------------------------
# 只有类名匹配此模式的类才会被识别为测试类
# 默认值是 Test*，这里显式声明
# 注意：Test 开头的类如果 __init__ 有参数会被跳过（pytest 要求测试类无参构造）
# 示例匹配：TestLogin, TestOrderAPI
# 示例不匹配：LoginTest, BaseTestCase（基类不会被执行）
python_classes = Test*


# ------------------------------------------------------------
# 测试函数/方法匹配规则
# ------------------------------------------------------------
# 只有函数名匹配此模式的函数才会被当作测试用例执行
# 支持多个模式，空格分隔
# 默认值是 test_*，这里显式声明
# 示例匹配：test_login_success, test_create_order_with_valid_data
# 示例不匹配：login(), helper_func(), setup()
python_functions = test_*


# ------------------------------------------------------------
# 默认命令行参数（addopts）
# ------------------------------------------------------------
# 每次运行 pytest 时自动追加这些参数，等价于：
#   pytest -v -s --alluredir=./reports/allure-results
#
# 各参数说明：
#   -v (--verbose)
#       详细输出模式，显示每个测试用例的 PASS/FAIL/SKIP 状态
#       不加 -v 只显示进度点（...F..E），加了才显示用例名称
#
#   -s (--capture=no)
#       禁用输出捕获，允许 print() 和 logging 实时输出到终端
#       不加 -s 的话，print 内容只在用例失败时才显示
#       ⚠️ 注意：-s 和 --tb=short 等选项可以共存，但 -s 会使终端输出变多
#
#   --alluredir=./reports/allure-results
#       Allure 报告原始数据输出目录
#       pytest-allure 插件会在每个用例执行完后往这个目录写 JSON/XML 文件
#       生成 HTML 报告命令：allure generate ./reports/allure-results -o ./reports/allure-report --clean
#       ⚠️ 需要先安装插件：pip install allure-pytest
addopts = -v -s --alluredir=./reports/allure-results --reruns 2 --reruns-delay 3


# ------------------------------------------------------------
# 自定义 Markers（标记）
# ------------------------------------------------------------
# 定义项目中使用的自定义标记，作用：
# 1. 消除 pytest 警告（未注册的 marker 会报 PytestUnknownMarkWarning）
# 2. 配合 -m 参数按标记筛选用例
# 3. 作为文档，让团队成员知道有哪些分类
#
# 使用方式：
#   # 在用例上打标记
#   @pytest.mark.smoke
#   def test_login():
#       ...
#
#   # 命令行按标记筛选
#   pytest -m smoke              → 只跑冒烟用例
#   pytest -m "not smoke"        → 跑除了冒烟以外的所有用例
#   pytest -m "smoke or regression" → 跑冒烟或回归用例
#   pytest -m "smoke and not slow"  → 跑冒烟且非慢速用例
markers =
    smoke: 冒烟测试用例 —— 核心主流程，每次提交必跑，数量少、速度快
    regression: 回归测试用例 —— 全量功能验证，发版前完整跑一遍